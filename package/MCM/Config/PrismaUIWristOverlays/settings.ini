; MCM Helper author-defaults for SteamVR's PrismaUI Wrist Overlays.
;
; THIS FILE IS REQUIRED. A ModSetting does not exist until an INI declares it —
; "defaultValue" in config.json only controls what "reset to default" restores,
; it does NOT register the setting. Without this file every control reads -1,
; its setter silently no-ops, dropdowns render blank, and nothing persists.
;
; MCM Helper reads this file first, then MCM/Settings/PrismaUIWristOverlays.ini
; (the player's saved values, written on first change).
;
; Section names MUST match the ":Section" suffix on each control id in
; config.json:  iResolution:Display -> [Display],  sIconSN:Icons -> [Icons]

[Display]
; 0 = 1920x1080, 1 = 2560x1440, 2 = 3840x2160
iResolution=0

[Icons]
; "Auto" = match by URL, "Off" = hide this icon, otherwise an overlay name
sIconSN=Auto
sIconSA=Auto
sIconIE=Auto
